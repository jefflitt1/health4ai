# Netlify backend for health4ai. Set this directory as the site's base directory.
[build]
  publish = "public"
  command = "pnpm run typecheck && pnpm test"

# Netlify's build reads this, not mise.toml; keep the two in step.
[build.environment]
  NODE_VERSION = "24.22.2"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    # The setup page takes the setup secret; no other site may frame it.
    Content-Security-Policy = "frame-ancestors 'none'"
