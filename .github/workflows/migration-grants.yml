name: Supabase grants

# From 2026-10-30 Supabase stops auto-granting Data API access (anon / authenticated / service_role) on NEW
# `public` tables. A table without an explicit GRANT then answers 42501, so the grant has to ship in the SQL
# that creates the table. This runs the lint that enforces it (scripts/check-migration-grants.py) and its tests.
# Not path-filtered: it is a few seconds of stdlib Python, and a skipped required check would block a PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workout-details:
    name: Optional workout detail contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start disposable local PostgreSQL
        run: |
          docker run -d --name jgle-test-db -p 127.0.0.1:54329:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for attempt in $(seq 1 30); do
            if docker exec jgle-test-db pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Real database and MCP tenant proof
        env:
          H4A_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:54329/postgres
        run: |
          python3 -m pip install psycopg2-binary python-dotenv
          python3 scripts/check-migration-grants.py supabase/optional/workout-details-v1.sql supabase/optional/workout-routes-v1.sql
          python3 scripts/tests/workout_detail_db_proof.py
          python3 -m unittest discover -s scripts/tests -p 'test_workout_proof_guards.py' -v
          python3 scripts/tests/workout_proof_guards.py
      - name: Ingest validation and auth wiring
        run: npm exec --yes --package=deno@2.7.12 -- deno test --allow-read supabase/functions/workout-details/handler_test.ts supabase/functions/workout-routes/validation_test.ts

  grants:
    name: Lint migration grants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Includes test_bootstrap_grants.py: schema.sql must equal a fresh build of supabase/bootstrap. Its
      # Supabase-Postgres proof skips here (the image is not pulled) and is run by hand before touching the grants.
      - name: Lint tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Migration grants lint
        run: scripts/lint-migration-grants.sh

  summary-precision:
    name: Summary precision regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start isolated local PostgreSQL
        run: |
          docker run -d --name jgle-test-db -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for attempt in $(seq 1 30); do
            if docker exec jgle-test-db pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise summary writer and checker
        run: python3 scripts/tests/test_summary_sum_tolerance.py
