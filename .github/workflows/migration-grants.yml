name: Supabase grants

# From 2026-10-30 Supabase stops auto-granting Data API access (anon / authenticated / service_role) on NEW
# `public` tables. A table without an explicit GRANT then answers 42501, so the grant has to ship in the SQL
# that creates the table. This runs the lint that enforces it (scripts/check-migration-grants.py) and its tests.
# Not path-filtered: it is a few seconds of stdlib Python, and a skipped required check would block a PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  grants:
    name: Lint migration grants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Includes test_bootstrap_grants.py: schema.sql must equal a fresh build of supabase/bootstrap. Its
      # Supabase-Postgres proof skips here (the image is not pulled) and is run by hand before touching the grants.
      - name: Lint tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Migration grants lint
        run: scripts/lint-migration-grants.sh
